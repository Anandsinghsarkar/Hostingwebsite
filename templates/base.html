<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>{% block title %}Hosting{% endblock %} — PyHost</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<nav>
    <div class="brand">⚡ PyHost</div>
    <div class="links">
        {% if user %}
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
            {% if user['is_admin'] %}<a href="{{ url_for('admin') }}">Admin</a>{% endif %}
            <span class="who">{{ user['username'] }}</span>
            <a href="{{ url_for('logout') }}" class="btn-ghost">Logout</a>
        {% endif %}
    </div>
</nav>
<main>
    {% with msgs = get_flashed_messages(with_categories=true) %}
        {% for cat, m in msgs %}
            <div class="flash flash-{{ cat }}">{{ m }}</div>
        {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
</main>
</body>
</html>
