{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="card auth">
    <h1>Create Account</h1>
    <form method="post">
        <label>Username<input name="username" required minlength="3" autofocus></label>
        <label>Password<input name="password" type="password" required minlength="4"></label>
        <button class="btn-primary">Sign up</button>
    </form>
    <p class="muted">Already have one? <a href="{{ url_for('login') }}">Login</a></p>
</div>
{% endblock %}
